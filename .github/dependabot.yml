version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      astro:
        patterns: ['astro', '@astrojs/*']
      testing:
        patterns: ['vitest', '@playwright/*', '@axe-core/*']
    ignore:
      # TypeScript 7 (native compiler) is not yet supported by @astrojs/check; revisit when it is.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
