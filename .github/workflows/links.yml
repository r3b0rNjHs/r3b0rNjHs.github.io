name: External links

# Third-party sites change without telling anyone. Once a week, check every external link on the
# live site and open (or update) an issue if any of them broke. Deploys never wait for this.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: List external links
        run: npm run links:external
      - name: Check external links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml external-links.md
          fail: false
          output: lychee-report.md
      - name: Report broken links as an issue
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: Broken external links
          content-filepath: lychee-report.md
          labels: links
