# Settings for the weekly external link check (.github/workflows/links.yml).

max_concurrency = 8
max_retries = 3
timeout = 30
accept = ["200..=299", "429"]
include_mail = false
# Input is the list from `npm run links:external`, which already leaves out pages of this site
# (those are checked on every deploy by scripts/check-links.mjs).
scheme = ["https", "http"]

exclude = [
  # LinkedIn answers automated requests with HTTP 999 even when the profile exists.
  '^https://(www\.)?linkedin\.com/',
  # Schema and feed namespaces, not pages.
  '^https://schema\.org',
]
